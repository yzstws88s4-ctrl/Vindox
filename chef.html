<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vindox Executive Command Center</title>
  
  <link rel="apple-touch-icon" href="4570730E-A0A2-4546-B316-B15BE9DD5EE4.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vindox Chef">
  <meta name="theme-color" content="#07090E">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg: #07090E;
      --card-bg: rgba(13, 20, 38, 0.75);
      --card-solid: #0B0E17;
      --card-border: rgba(255, 255, 255, 0.07);
      --card-border-active: rgba(37, 99, 235, 0.5);
      --accent-main: #1E3A8A;
      --accent-bright: #2563EB;
      --accent-light: #60A5FA;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --text-muted: #64748B;
      --success: #10B981;
      --success-bg: rgba(16, 185, 129, 0.1);
      --warning: #F59E0B;
      --warning-bg: rgba(245, 158, 11, 0.12);
      --danger: #EF4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .app-viewport {
      width: 100%;
      max-width: 1560px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* HEADER */
    header {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo-img {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 20px var(--accent-glow);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .driver-info {
      font-size: 0.75rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill-btn {
      background: var(--card-solid);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .pill-btn:hover {
      border-color: var(--accent-bright);
      background: rgba(37, 99, 235, 0.08);
      transform: translateY(-1px);
    }

    /* KPI GRID */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    @media (max-width: 1024px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .kpi-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.06em; }
    .kpi-value { font-size: 1.8rem; font-weight: 900; color: var(--text-main); margin-top: 4px; letter-spacing: -0.02em; }
    .kpi-icon { width: 44px; height: 44px; border-radius: 14px; background: rgba(37, 99, 235, 0.12); color: var(--accent-light); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(37, 99, 235, 0.25); }

    /* COMMAND LAYOUT (2 SPALTEN) */
    .command-layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 20px;
    }

    @media (max-width: 1100px) {
      .command-layout { grid-template-columns: 1fr; }
    }

    .panel-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      backdrop-filter: blur(25px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 520px;
      max-height: 720px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-sub);
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 14px;
    }

    .scroll-area {
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    /* LIVE DRIVER CARD */
    .live-card {
      background: var(--card-solid);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 18px;
      transition: all 0.2s ease;
    }
    .live-card:hover { border-color: var(--card-border-active); }

    .live-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .driver-avatar-badge {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: rgba(37, 99, 235, 0.15);
      color: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
      border: 1px solid rgba(37, 99, 235, 0.3);
    }

    .progress-bar-bg {
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 3px;
      overflow: hidden;
      margin: 14px 0 10px 0;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-main), var(--accent-bright));
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    /* FORM & INPUTS */
    label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }

    input, select, textarea {
      width: 100%; background: rgba(3, 5, 8, 0.6); border: 1px solid var(--card-border); border-radius: 14px;
      padding: 13px 16px; color: var(--text-main); font-size: 0.88rem; outline: none; margin-bottom: 14px;
      transition: border-color 0.2s ease;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-bright); }

    .btn-action-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-main), var(--accent-bright));
      border: none;
      color: #FFF;
      padding: 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .status-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; font-size: 0.68rem; font-weight: 800; text-transform: uppercase; }
    .status-chip.done { background: var(--success-bg); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
    .status-chip.open { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.2); }
    .status-chip.danger { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }

    /* TOAST */
    .app-toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #0B0E17; color: #ffffff; padding: 14px 22px;
      border-radius: 16px; border: 1px solid var(--accent-bright);
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 10px;
      z-index: 9999; opacity: 0; transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none;
    }
    .app-toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <div id="toastBanner" class="app-toast">
    <span id="toastIcon">✓</span>
    <span id="toastMessage">Aktion erfolgreich</span>
  </div>

  <div class="app-viewport">
    
    <!-- HEADER -->
    <header>
      <div class="brand-group">
        <img src="4570730E-A0A2-4546-B316-B15BE9DD5EE4.png" alt="Vindox Logo" class="brand-logo-img">
        <div class="brand-text">
          <h1>Vindox Command Center</h1>
          <div class="driver-info" id="chefGreetingLabel">Executive Dashboard</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="pill-btn" onclick="showToast('Modul Team & Lizenzen', '👥')">👥 Team & Lizenzen</button>
        <button class="pill-btn" onclick="showToast('Modul Nachweise & Audit', '📄')">📄 Nachweise & Audit</button>
        <button class="pill-btn" onclick="showToast('Modul Firmendaten', '🏢')">🏢 Firmendaten</button>
        <button class="pill-btn" onclick="logout()" style="color: var(--danger); border-color: rgba(239,68,68,0.3);">Abmelden</button>
      </div>
    </header>

    <!-- KPI ROW -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div>
          <div class="kpi-label">Aktive Fahrer</div>
          <div class="kpi-value" id="kpiActiveDrivers">0</div>
        </div>
        <div class="kpi-icon">👤</div>
      </div>
      <div class="kpi-card">
        <div>
          <div class="kpi-label">Geplante Touren</div>
          <div class="kpi-value" id="kpiTotalTours">0</div>
        </div>
        <div class="kpi-icon">🗺️</div>
      </div>
      <div class="kpi-card">
        <div>
          <div class="kpi-label">Abschlussquote</div>
          <div class="kpi-value" id="kpiCompletionRate">0%</div>
        </div>
        <div class="kpi-icon">⚡</div>
      </div>
      <div class="kpi-card">
        <div>
          <div class="kpi-label">Fotobeweise Heute</div>
          <div class="kpi-value" id="kpiProofsToday">0</div>
        </div>
        <div class="kpi-icon">📸</div>
      </div>
    </div>

    <!-- COMMAND LAYOUT -->
    <div class="command-layout">
      
      <!-- LINKE SPALTE: LIVE MONITOR -->
      <div class="panel-box">
        <div class="panel-header">
          <span>🔴 Live-Fahrer & Echtzeit-Status</span>
          <span class="status-chip done">Realtime Aktiv</span>
        </div>
        <div class="scroll-area" id="liveToursContainer">
          <p style="color:var(--text-muted); font-size:0.85rem; text-align:center; padding:40px;">Lade Live-Daten aus Supabase...</p>
        </div>
      </div>

      <!-- RECHTE SPALTE: TOUR PLANER & OCR -->
      <div class="panel-box">
        <div class="panel-header">
          <span>🚀 Tour-Planer & OCR Scan</span>
          <span style="font-size:0.72rem; color:var(--accent-light);">Sofort-Zuweisung</span>
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label>Tour per Foto erfassen (OCR)</label>
          <div style="border: 2px dashed var(--card-border-active); border-radius:14px; padding:14px; text-align:center; background:rgba(3, 5, 8, 0.5); margin-bottom:12px;">
            <div style="display:flex; gap:10px; justify-content:center;">
              <button class="pill-btn" onclick="document.getElementById('bossCameraInput').click()">📷 Kamera Scan</button>
              <button class="pill-btn" onclick="document.getElementById('bossFileInput').click()">📁 Datei wählen</button>
            </div>
            <input type="file" id="bossCameraInput" accept="image/*" capture="environment" style="display:none;" onchange="processBossTourScan(event)">
            <input type="file" id="bossFileInput" accept="image/*" style="display:none;" onchange="processBossTourScan(event)">
            <div id="scanStatusMsg" style="font-size:0.75rem; color:var(--success); font-weight:700; margin-top:8px; display:none;">✓ Eingelesen</div>
          </div>

          <label>Tour-Titel</label>
          <input type="text" id="tourTitle" placeholder="z. B. Tour Nord - Engelskirchen">
          
          <label>Fahrer zuweisen</label>
          <select id="tourAssignee"></select>

          <label>Adressen (zeilenweise)</label>
          <textarea id="tourAddresses" style="height: 110px; font-family: monospace; font-size: 0.82rem;" placeholder="Hauptstraße 1, 51766 Engelskirchen&#10;Dörner Weg 20, 51766 Engelskirchen"></textarea>

          <button class="btn-action-primary" onclick="createAndSendTour()">
            🚀 Tour an Fahrer übertragen
          </button>
        </div>
      </div>

    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://cvfbkxzhpxopbkaymvvf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EK07XF7umKLsdfbRK9p6gQ_0-5AkSjb';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentChef = null;
    let driversList = [];

    function showToast(message, icon = '✓') {
      const toast = document.getElementById('toastBanner');
      document.getElementById('toastMessage').innerText = message;
      document.getElementById('toastIcon').innerText = icon;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    window.onload = async () => {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session || !session.user) {
          renderMockData();
          return;
        }
        currentChef = session.user;
        const meta = currentChef.user_metadata || {};
        const chefName = meta.name || meta.full_name || currentChef.email?.split('@')[0] || 'Chef';
        document.getElementById('chefGreetingLabel').innerText = `Eingeloggt als ${chefName}`;

        await loadDriversFromSupabase();
        await loadToursFromSupabase();
        subscribeRealtime();
      } catch (err) {
        renderMockData();
      }
    };

    function renderMockData() {
      document.getElementById('liveToursContainer').innerHTML = `
        <div class="live-card">
          <div class="live-card-top">
            <div style="display:flex; align-items:center; gap:12px;">
              <div class="driver-avatar-badge">M</div>
              <div>
                <strong>Max (Demo Tour)</strong>
                <div style="font-size:0.75rem; color:var(--text-sub);">Engelskirchen Zentrum</div>
              </div>
            </div>
            <span class="status-chip done">🟢 Unterwegs</span>
          </div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: 60%;"></div></div>
          <div style="display:flex; justify-content:space-between; font-size:0.72rem; color:var(--text-sub); font-weight:700;">
            <span>Stopps: 6 von 10 erledigt</span>
            <span style="color:var(--accent-light);">60%</span>
          </div>
        </div>
      `;
    }

    function subscribeRealtime() {
      supabaseClient.channel('public:stops').on('postgres_changes', { event: '*', schema: 'public', table: 'stops' }, () => loadToursFromSupabase()).subscribe();
      supabaseClient.channel('public:tours').on('postgres_changes', { event: '*', schema: 'public', table: 'tours' }, () => loadToursFromSupabase()).subscribe();
    }

    async function loadDriversFromSupabase() {
      const { data: profiles } = await supabaseClient.from('profiles').select('*').eq('role', 'driver').eq('is_active', true);
      driversList = profiles || [];
      document.getElementById('kpiActiveDrivers').innerText = driversList.length;
      
      const select = document.getElementById('tourAssignee');
      if (select) {
        select.innerHTML = driversList.length ? driversList.map(d => `<option value="${d.id}">${d.full_name || d.email}</option>`).join('') : '<option value="">Keine Fahrer verfügbar</option>';
      }
    }

    async function loadToursFromSupabase() {
      const { data: tours } = await supabaseClient
        .from('tours')
        .select('*, stops(*), profiles:assigned_to(full_name, email, is_active)')
        .order('created_at', { ascending: false });
      
      const todayStr = new Date().toISOString().split('T')[0];
      const liveActiveTours = (tours || []).filter(t => t.profiles?.is_active === true && (t.status === 'aktiv' || t.status === 'abgebrochen') && t.created_at?.startsWith(todayStr));
      const plannedTours = (tours || []).filter(t => t.status === 'geplant');
      
      document.getElementById('kpiTotalTours').innerText = plannedTours.length;
      
      let totalStops = 0, doneStops = 0, photosToday = 0;
      (tours || []).forEach(t => {
        if (t.stops) {
          totalStops += t.stops.length;
          doneStops += t.stops.filter(s => s.status === 'erledigt').length;
          photosToday += t.stops.filter(s => s.photo_url).length;
        }
      });
      
      document.getElementById('kpiCompletionRate').innerText = `${totalStops > 0 ? Math.round((doneStops / totalStops) * 100) : 0}%`;
      document.getElementById('kpiProofsToday').innerText = photosToday;

      renderLiveMonitor(liveActiveTours);
    }

    function renderLiveMonitor(activeTours) {
      const container = document.getElementById('liveToursContainer');
      if (!container) return;

      if (activeTours.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 40px; color:var(--text-muted); font-size:0.85rem;">Aktuell keine Touren live in Durchführung.</div>`;
        return;
      }

      container.innerHTML = activeTours.map(tour => {
        const stops = (tour.stops || []).sort((a, b) => (a.sequence || 0) - (b.sequence || 0));
        const total = stops.length;
        const doneCount = stops.filter(s => s.status === 'erledigt').length;
        const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
        const driverName = tour.profiles?.full_name || tour.profiles?.email || 'Fahrer';
        const initials = driverName.substring(0, 2).toUpperCase();

        return `
          <div class="live-card">
            <div class="live-card-top">
              <div style="display:flex; align-items:center; gap:12px;">
                <div class="driver-avatar-badge">${initials}</div>
                <div>
                  <strong>${driverName}</strong>
                  <div style="font-size:0.75rem; color:var(--text-sub);">${tour.title}</div>
                </div>
              </div>
              <span class="status-chip ${tour.status === 'abgebrochen' ? 'danger' : 'done'}">${tour.status === 'abgebrochen' ? '❌ Abgebrochen' : '🟢 Unterwegs'}</span>
            </div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${pct}%;"></div></div>
            <div style="display:flex; justify-content:space-between; font-size:0.72rem; color:var(--text-sub); font-weight:700;">
              <span>Stopps: ${doneCount} von ${total} erledigt</span>
              <span style="color:var(--accent-light);">${pct}%</span>
            </div>
          </div>
        `;
      }).join('');
    }

    async function processBossTourScan(e) {
      const file = e.target.files[0];
      if (!file) return;
      const statusMsg = document.getElementById('scanStatusMsg');
      statusMsg.style.display = 'block';
      statusMsg.innerText = '⏳ OCR Analyse läuft...';

      try {
        const worker = await Tesseract.createWorker('deu');
        const ret = await worker.recognize(file);
        await worker.terminate();

        const lines = ret.data.text.split('\n').map(l => l.trim()).filter(l => l.length > 3);
        if (lines.length > 0) {
          document.getElementById('tourAddresses').value = lines.join('\n');
          statusMsg.innerText = `✓ ${lines.length} Adressen erkannt`;
        } else {
          statusMsg.innerText = '⚠ Keine Adressen erkannt.';
        }
      } catch (err) { statusMsg.innerText = '❌ OCR Fehler'; }
      setTimeout(() => { statusMsg.style.display = 'none'; }, 4000);
      e.target.value = '';
    }

    async function createAndSendTour() {
      const title = document.getElementById('tourTitle').value.trim() || 'Tour ' + new Date().toLocaleDateString('de-DE');
      const driverId = document.getElementById('tourAssignee').value;
      const addressText = document.getElementById('tourAddresses').value.trim();

      if (!driverId || !addressText) return showToast('Bitte Fahrer und Adressen angeben!', '⚠️');
      const addresses = addressText.split('\n').map(a => a.trim()).filter(a => a.length > 2);

      const { data: tourData, error } = await supabaseClient.from('tours').insert([{
        title, assigned_to: driverId, created_by: currentChef?.id || 'demo', status: 'geplant'
      }]).select('*').single();

      if (error) return showToast('Fehler: ' + error.message, '⚠️');

      const stops = addresses.map((addr, idx) => ({ tour_id: tourData.id, address: addr, sequence: idx + 1, status: 'offen' }));
      await supabaseClient.from('stops').insert(stops);

      showToast('Tour erfolgreich an Fahrer übertragen!');
      document.getElementById('tourAddresses').value = '';
      document.getElementById('tourTitle').value = '';
      await loadToursFromSupabase();
    }

    async function logout() {
      try { await supabaseClient.auth.signOut(); } catch (e) {}
      window.location.replace('login.html');
    }
  </script>
</body>
</html>
