<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vindox – Executive Command Center</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
:root {
  --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --bg: #07090E;
  --surface: #0D1426;
  --surface-solid: #0B0E17;
  --surface-hover: #131D35;
  --border: rgba(255, 255, 255, 0.08);
  --border-active: rgba(37, 99, 235, 0.5);
  --text-main: #F8FAFC;
  --text-sub: #94A3B8;
  --text-muted: #64748B;
  --accent: #2563EB;
  --accent-hover: #1D4ED8;
  --accent-glow: rgba(37, 99, 235, 0.3);
  --input-bg: rgba(3, 5, 8, 0.7);
  --success: #10B981;
  --success-bg: rgba(16, 185, 129, 0.12);
  --warning: #F59E0B;
  --warning-bg: rgba(245, 158, 11, 0.12);
  --danger: #EF4444;
  --danger-bg: rgba(239, 68, 68, 0.12);
  --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 30px rgba(37, 99, 235, 0.08);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  margin: 0;
  background-color: var(--bg);
  color: var(--text-main);
  font-family: var(--font);
}

body {
  padding: 24px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.app-container {
  width: 100%;
  max-width: 1560px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* TOP NAVIGATION & HEADER */
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 16px 24px;
  box-shadow: var(--shadow);
}

.brand-area {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-logo {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, #2563EB, #1E3A8A);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 18px;
  color: #fff;
  box-shadow: 0 4px 12px var(--accent-glow);
}

.brand-title {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-main);
}

.brand-subtitle {
  font-size: 11px;
  color: var(--text-sub);
  font-weight: 500;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.pill-btn {
  background: var(--surface-solid);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 10px 18px;
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
  transition: all 0.2s ease;
}
.pill-btn:hover {
  border-color: var(--accent);
  background: var(--surface-hover);
  transform: translateY(-1px);
}

/* KPI OVERVIEW GRID */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}

.kpi-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.06em; }
.kpi-value { font-size: 24px; font-weight: 800; color: var(--text-main); margin-top: 4px; }
.kpi-icon { width: 42px; height: 42px; border-radius: 12px; background: rgba(37, 99, 235, 0.1); color: #60A5FA; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(37, 99, 235, 0.2); }

/* MAIN DASHBOARD LAYOUT (2 SPALTEN COMMAND CENTER) */
.command-layout {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 20px;
}

@media (max-width: 1200px) {
  .command-layout { grid-template-columns: 1fr; }
}

.panel-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 24px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-height: 520px;
  max-height: 680px;
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-sub);
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
}

.scroll-area {
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-right: 4px;
}

/* LIVE DRIVER CARD */
.live-card {
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: all 0.2s ease;
}
.live-card:hover { border-color: var(--border-active); }

.live-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.driver-avatar-badge {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: rgba(37, 99, 235, 0.15);
  color: #60A5FA;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 14px;
  border: 1px solid rgba(37, 99, 235, 0.3);
}

.progress-bar-bg {
  background: rgba(255,255,255,0.06);
  height: 6px;
  border-radius: 3px;
  overflow: hidden;
  margin: 12px 0 8px 0;
}

.progress-bar-fill {
  background: linear-gradient(90deg, #1E3A8A, #10B981);
  height: 100%;
  transition: width 0.4s ease;
}

/* FORMULARE & INPUTS */
label { display: block; font-size: 11px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }

input, select, textarea {
  width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 16px; color: var(--text-main); font-family: inherit; font-size: 13px; margin-bottom: 14px;
  transition: border-color 0.2s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

button.btn-primary {
  background: linear-gradient(135deg, #1E3A8A, #2563EB); color: white; border: none; border-radius: 12px;
  padding: 14px 18px; font-weight: 800; font-size: 13px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  box-shadow: 0 6px 20px var(--accent-glow); transition: opacity 0.2s;
}
button.btn-primary:hover { opacity: 0.9; }

.status-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
.status-chip.done { background: var(--success-bg); color: var(--success); }
.status-chip.open { background: var(--warning-bg); color: var(--warning); }
.status-chip.danger { background: var(--danger-bg); color: var(--danger); }

/* TOAST NOTIFICATION */
.app-toast {
  position: fixed; bottom: 24px; right: 24px;
  background: #0B0E17; color: #ffffff; padding: 14px 22px;
  border-radius: 16px; border: 1px solid var(--accent);
  box-shadow: 0 15px 35px rgba(0,0,0,0.6);
  font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 10px;
  z-index: 9999; opacity: 0; transform: translateY(20px);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none;
}
.app-toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<div id="toastBanner" class="app-toast">
  <span id="toastIcon">✓</span>
  <span id="toastMessage">Aktion erfolgreich</span>
</div>

<div class="app-container">

  <!-- HEADER -->
  <div class="header-bar">
    <div class="brand-area">
      <div class="brand-logo">V</div>
      <div>
        <div class="brand-title">Vindox Command Center</div>
        <div class="brand-subtitle" id="chefGreetingLabel">Executive Dashboard</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="pill-btn" onclick="openModule('pane-team')">👥 Team & Lizenzen</button>
      <button class="pill-btn" onclick="openModule('pane-proofs')">📄 Nachweise & Audit</button>
      <button class="pill-btn" onclick="openModule('pane-company')">🏢 Firmendaten</button>
      <button class="pill-btn" onclick="logout()" style="color: var(--danger); border-color: rgba(239,68,68,0.3);">Abmelden</button>
    </div>
  </div>

  <!-- KPI ROW -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div>
        <div class="kpi-label">Aktive Fahrer</div>
        <div class="kpi-value" id="kpiActiveDrivers">0</div>
      </div>
      <div class="kpi-icon">👤</div>
    </div>
    <div class="kpi-card">
      <div>
        <div class="kpi-label">Geplante Touren</div>
        <div class="kpi-value" id="kpiTotalTours">0</div>
      </div>
      <div class="kpi-icon">🗺️</div>
    </div>
    <div class="kpi-card">
      <div>
        <div class="kpi-label">Abschlussquote</div>
        <div class="kpi-value" id="kpiCompletionRate">0%</div>
      </div>
      <div class="kpi-icon">⚡</div>
    </div>
    <div class="kpi-card">
      <div>
        <div class="kpi-label">Fotobeweise Heute</div>
        <div class="kpi-value" id="kpiProofsToday">0</div>
      </div>
      <div class="kpi-icon">📸</div>
    </div>
  </div>

  <!-- MAIN COMMAND LAYOUT -->
  <div class="command-layout">
    
    <!-- LINKE SPALTE: LIVE MONITOR -->
    <div class="panel-box">
      <div class="panel-header">
        <span>🔴 Live-Fahrer & Echtzeit-Status</span>
        <span class="status-chip done">Realtime Aktiv</span>
      </div>
      <div class="scroll-area" id="liveToursContainer">
        <p style="color:var(--text-muted); font-size:13px; text-align:center; padding:40px;">Lade Live-Daten...</p>
      </div>
    </div>

    <!-- RECHTE SPALTE: TOUR SCHNELL-ERSTELLUNG & OCR -->
    <div class="panel-box">
      <div class="panel-header">
        <span>🚀 Tour-Planer & OCR Scan</span>
        <span style="font-size:11px; color:var(--accent);">Sofort-Zuweisung</span>
      </div>
      
      <div>
        <label>Tour per Foto erfassen (OCR)</label>
        <div style="border: 2px dashed var(--border-active); border-radius:12px; padding:12px; text-align:center; background:var(--input-bg); margin-bottom:14px;">
          <div style="display:flex; gap:10px; justify-content:center;">
            <button class="pill-btn" onclick="document.getElementById('bossCameraInput').click()">📷 Kamera</button>
            <button class="pill-btn" onclick="document.getElementById('bossFileInput').click()">📁 Datei</button>
          </div>
          <input type="file" id="bossCameraInput" accept="image/*" capture="environment" style="display:none;" onchange="processBossTourScan(event)">
          <input type="file" id="bossFileInput" accept="image/*" style="display:none;" onchange="processBossTourScan(event)">
          <div id="scanStatusMsg" style="font-size:11px; color:var(--success); font-weight:600; margin-top:6px; display:none;">✓ Eingelesen</div>
        </div>

        <label>Tour-Titel</label>
        <input type="text" id="tourTitle" placeholder="z. B. Tour Nord">
        
        <label>Fahrer zuweisen</label>
        <select id="tourAssignee"></select>

        <label>Adressen (zeilenweise)</label>
        <textarea id="tourAddresses" style="height: 110px; font-family: monospace; font-size: 12px;" placeholder="Hauptstraße 1, 51766 Engelskirchen&#10;Dörner Weg 20, 51766 Engelskirchen"></textarea>

        <button class="btn-primary" onclick="createAndSendTour()">
          🚀 Tour an Fahrer übertragen
        </button>
      </div>

    </div>

  </div>

</div>

<script>
const SUPABASE_URL = 'https://cvfbkxzhpxopbkaymvvf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_EK07XF7umKLsdfbRK9p6gQ_0-5AkSjb';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentChef = null;
let driversList = [];

function showToast(message, icon = '✓') {
  const toast = document.getElementById('toastBanner');
  document.getElementById('toastMessage').innerText = message;
  document.getElementById('toastIcon').innerText = icon;
  toast.classList.add('show');
  setTimeout(() => { toast.classList.remove('show'); }, 3000);
}

window.onload = async () => {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session || !session.user) {
      renderMockData();
      return;
    }
    currentChef = session.user;
    const meta = currentChef.user_metadata || {};
    const chefName = meta.name || meta.full_name || currentChef.email?.split('@')[0] || 'Chef';
    document.getElementById('chefGreetingLabel').innerText = `Hallo ${chefName}`;

    await loadDriversFromSupabase();
    await loadToursFromSupabase();
    subscribeRealtime();
  } catch (err) {
    renderMockData();
  }
};

function renderMockData() {
  document.getElementById('liveToursContainer').innerHTML = `
    <div class="live-card">
      <div class="live-card-top">
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="driver-avatar-badge">M</div>
          <div>
            <strong>Max (Demo Tour)</strong>
            <div style="font-size:11px; color:var(--text-sub);">Engelskirchen Zentrum</div>
          </div>
        </div>
        <span class="status-chip done">🟢 Unterwegs</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: 60%;"></div></div>
      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-sub); font-weight:700;">
        <span>Stopps: 6 von 10 erledigt</span>
        <span>60%</span>
      </div>
    </div>
  `;
}

function subscribeRealtime() {
  supabaseClient.channel('public:stops').on('postgres_changes', { event: '*', schema: 'public', table: 'stops' }, () => loadToursFromSupabase()).subscribe();
  supabaseClient.channel('public:tours').on('postgres_changes', { event: '*', schema: 'public', table: 'tours' }, () => loadToursFromSupabase()).subscribe();
}

async function loadDriversFromSupabase() {
  const { data: profiles } = await supabaseClient.from('profiles').select('*').eq('role', 'driver').eq('is_active', true);
  driversList = profiles || [];
  document.getElementById('kpiActiveDrivers').innerText = driversList.length;
  
  const select = document.getElementById('tourAssignee');
  if (select) {
    select.innerHTML = driversList.length ? driversList.map(d => `<option value="${d.id}">${d.full_name || d.email}</option>`).join('') : '<option value="">Keine Fahrer verfügbar</option>';
  }
}

async function loadToursFromSupabase() {
  const { data: tours } = await supabaseClient
    .from('tours')
    .select('*, stops(*), profiles:assigned_to(full_name, email, is_active)')
    .order('created_at', { ascending: false });
  
  const todayStr = new Date().toISOString().split('T')[0];
  const liveActiveTours = (tours || []).filter(t => t.profiles?.is_active === true && (t.status === 'aktiv' || t.status === 'abgebrochen') && t.created_at?.startsWith(todayStr));
  const plannedTours = (tours || []).filter(t => t.status === 'geplant');
  
  document.getElementById('kpiTotalTours').innerText = plannedTours.length;
  
  let totalStops = 0, doneStops = 0, photosToday = 0;
  (tours || []).forEach(t => {
    if (t.stops) {
      totalStops += t.stops.length;
      doneStops += t.stops.filter(s => s.status === 'erledigt').length;
      photosToday += t.stops.filter(s => s.photo_url).length;
    }
  });
  
  document.getElementById('kpiCompletionRate').innerText = `${totalStops > 0 ? Math.round((doneStops / totalStops) * 100) : 0}%`;
  document.getElementById('kpiProofsToday').innerText = photosToday;

  renderLiveMonitor(liveActiveTours);
}

function renderLiveMonitor(activeTours) {
  const container = document.getElementById('liveToursContainer');
  if (!container) return;

  if (activeTours.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding: 40px; color:var(--text-muted); font-size:13px;">Aktuell keine Touren live in Durchführung.</div>`;
    return;
  }

  container.innerHTML = activeTours.map(tour => {
    const stops = (tour.stops || []).sort((a, b) => (a.sequence || 0) - (b.sequence || 0));
    const total = stops.length;
    const doneCount = stops.filter(s => s.status === 'erledigt').length;
    const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
    const driverName = tour.profiles?.full_name || tour.profiles?.email || 'Fahrer';
    const initials = driverName.substring(0, 2).toUpperCase();

    return `
      <div class="live-card">
        <div class="live-card-top">
          <div style="display:flex; align-items:center; gap:12px;">
            <div class="driver-avatar-badge">${initials}</div>
            <div>
              <strong>${driverName}</strong>
              <div style="font-size:11px; color:var(--text-sub);">${tour.title}</div>
            </div>
          </div>
          <span class="status-chip ${tour.status === 'abgebrochen' ? 'danger' : 'done'}">${tour.status === 'abgebrochen' ? '❌ Abgebrochen' : '🟢 Unterwegs'}</span>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${pct}%;"></div></div>
        <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-sub); font-weight:700;">
          <span>Stopps: ${doneCount} von ${total} erledigt</span>
          <span style="color:#60A5FA;">${pct}%</span>
        </div>
      </div>
    `;
  }).join('');
}

async function processBossTourScan(e) {
  const file = e.target.files[0];
  if (!file) return;
  const statusMsg = document.getElementById('scanStatusMsg');
  statusMsg.style.display = 'block';
  statusMsg.innerText = '⏳ OCR Analyse läuft...';

  try {
    const result = await Tesseract.recognize(file, 'deu');
    const lines = result.data.text.split(/\r?\n|;/).map(l => l.replace(/^\s*\d+[\.\)\-]?\s*/, '').trim()).filter(l => l.length > 3);
    if (lines.length > 0) {
      document.getElementById('tourAddresses').value = lines.join('\n');
      statusMsg.innerText = `✓ ${lines.length} Adressen eingelesen`;
    } else {
      statusMsg.innerText = '⚠ Keine Adressen erkannt.';
    }
  } catch (err) { statusMsg.innerText = '❌ OCR Fehler'; }
  setTimeout(() => { statusMsg.style.display = 'none'; }, 4000);
  e.target.value = '';
}

async function createAndSendTour() {
  const title = document.getElementById('tourTitle').value.trim() || 'Tour ' + new Date().toLocaleDateString('de-DE');
  const driverId = document.getElementById('tourAssignee').value;
  const addressText = document.getElementById('tourAddresses').value.trim();

  if (!driverId || !addressText) return showToast('Bitte Fahrer und Adressen angeben!', '⚠️');
  const addresses = addressText.split('\n').map(a => a.trim()).filter(a => a.length > 2);

  const { data: tourData, error } = await supabaseClient.from('tours').insert([{
    title, assigned_to: driverId, created_by: currentChef?.id || 'demo', status: 'geplant'
  }]).select('*').single();

  if (error) return showToast('Fehler: ' + error.message, '⚠️');

  const stops = addresses.map((addr, idx) => ({ tour_id: tourData.id, address: addr, sequence: idx + 1, status: 'offen' }));
  await supabaseClient.from('stops').insert(stops);

  showToast('Tour erfolgreich an Fahrer übermittelt!');
  document.getElementById('tourAddresses').value = '';
  document.getElementById('tourTitle').value = '';
  await loadToursFromSupabase();
}

function openModule(paneId) {
  showToast('Öffne ' + paneId, 'ℹ️');
}

async function logout() {
  try { await supabaseClient.auth.signOut(); } catch (e) {}
  window.location.replace('login.html');
}
</script>
</body>
</html>
